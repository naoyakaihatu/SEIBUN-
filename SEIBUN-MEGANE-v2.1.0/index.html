<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#4f7f60">
  <meta name="description" content="化粧品の成分表を撮ると、今の悩みに合わせて分かりやすく整理するSEIBUNメガネ">
  <title>SEIBUNメガネ｜化粧品成分チェック</title>
  <link id="manifestLink" rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="back-button hidden" onclick="SEIBUN.back()" aria-label="前の画面へ"><span>‹</span><small>戻る</small></button>
    <button class="brand" data-view="home" aria-label="ホームへ">
      <span id="brandMark" class="brand-mark">S</span><strong id="brandName">SEIBUNメガネ</strong><small id="brandBeta"></small>
    </button>
    <div class="top-actions">
      <button id="installBtn" class="top-pill hidden">アプリとして追加</button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <nav class="bottom-nav" aria-label="メインメニュー">
    <button data-view="home"><span>⌂</span><small>ホーム</small></button>
    <button data-view="scan" class="scan-main"><span>◉</span><small>メガネ</small></button>
    <button data-view="ingredients"><span>成</span><small>成分辞典</small></button>
    <button data-view="history"><span>履</span><small>履歴</small></button>
  </nav>

  <footer class="site-footer minimal-footer-v21">
    <span id="footerBrandName">SEIBUNメガネ</span>
    <nav aria-label="ポリシー"><button data-view="legal">ご利用上の注意</button><button data-view="contact">お問い合わせ</button></nav>
  </footer>

  <dialog id="detailDialog">
    <div class="dialog-shell">
      <button class="dialog-x" onclick="SEIBUN.closeDialog()" aria-label="閉じる">×</button>
      <div id="dialogContent"></div>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <script src="data/app_data.js"></script>
  <script src="data/skin_research.js"></script>
  <script src="data/scan_lexicon.js"></script>
  <script src="data/analysis_rules.js"></script>
  <script src="data/ingredient_guides.js"></script>
  <script src="data/ingredient_master.js"></script>
  <script src="data/verified_ingredients_v110.js"></script>
  <script src="data/config.js"></script>

  <script src="js/core.js"></script>
  <script src="js/legal.js"></script>
  <script src="js/contact.js"></script>
  <script src="js/ingredients.js"></script>
  <script src="js/skin.js"></script>
  <script src="js/ocr.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
